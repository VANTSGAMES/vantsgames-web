name: "Bot · rotar VANTS_BOT_SECRET y ejecutar /setup"

# Genera un nuevo secreto aleatorio seguro (hex de 64 caracteres),
# lo actualiza mediante `wrangler secret put VANTS_BOT_SECRET` en `vantsbot`, `vants`
# (y cualquier otro Worker de la cuenta que ya tenga `VANTS_BOT_SECRET`),
# lo sincroniza en GitHub Secrets y llama inmediatamente a POST https://bot.vants.cc/setup.
on:
  workflow_dispatch:

concurrency:
  group: rotar-bot-secret-y-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotar-y-setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
      PAT1: ${{ secrets.VANTS_GH_PAT_SECRETS }}
      PAT2: ${{ secrets.GHPAT_VANTS }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rotar VANTS_BOT_SECRET en Cloudflare y GitHub + POST /setup
        run: |
          set -euo pipefail
          NEW_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$NEW_SECRET"
          if [ "${#NEW_SECRET}" -ne 64 ]; then
            echo "Error: longitud inesperada del secreto" >&2
            exit 1
          fi

          # Detectar Workers que ya tienen VANTS_BOT_SECRET y garantizar siempre vantsbot y vants
          TARGETS="$(node -e '
            const acct = process.env.CLOUDFLARE_ACCOUNT_ID;
            const tok = process.env.CLOUDFLARE_API_TOKEN;
            const hdr = { Authorization: `Bearer ${tok}` };
            (async () => {
              const set = new Set(["vantsbot", "vants"]);
              const listRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${acct}/workers/scripts`, { headers: hdr });
              const listJson = await listRes.json().catch(() => null);
              for (const w of listJson?.result || []) {
                const id = String(w.id || "");
                if (!id || set.has(id)) continue;
                const sr = await fetch(`https://api.cloudflare.com/client/v4/accounts/${acct}/workers/scripts/${id}/settings`, { headers: hdr });
                const sj = await sr.json().catch(() => null);
                const has = (sj?.result?.bindings || []).some((b) => b.name === "VANTS_BOT_SECRET");
                if (has) set.add(id);
              }
              process.stdout.write([...set].join("\n"));
            })().catch((e) => { console.error(String(e)); process.exit(1); });
          ')"

          mkdir -p /tmp/wr-sec && cd /tmp/wr-sec
          for W in $TARGETS; do
            echo "[cf] Actualizando VANTS_BOT_SECRET en Worker: $W"
            printf '%s' "$NEW_SECRET" | npx -y wrangler@4 secret put VANTS_BOT_SECRET --name "$W"
          done

          # Sincronizar también en GitHub Secrets de ambos repositorios
          for P in "$PAT1" "$PAT2"; do
            [ -z "$P" ] && continue
            if GH_TOKEN="$P" gh secret list --repo VANTSGAMES/vantsbot-cf >/dev/null 2>&1; then
              printf '%s' "$NEW_SECRET" | GH_TOKEN="$P" gh secret set VANTS_BOT_SECRET --repo VANTSGAMES/vantsbot-cf
              printf '%s' "$NEW_SECRET" | GH_TOKEN="$P" gh secret set VANTS_BOT_SECRET --repo VANTSGAMES/vantsgames-web
              echo "[gh] VANTS_BOT_SECRET sincronizado en VANTSGAMES/vantsbot-cf y VANTSGAMES/vantsgames-web"
              break
            fi
          done

          # Esperar propagación y ejecutar POST https://bot.vants.cc/setup
          sleep 6
          HTTP_CODE="$(curl -sS -o /tmp/setup.json -w '%{http_code}' \
            -X POST https://bot.vants.cc/setup \
            -H "x-vants-bot: $NEW_SECRET" \
            -A "Mozilla/5.0 (compatible; VANTSHealthCheck/1.0; +https://vants.cc)")"
          echo "[setup] HTTP $HTTP_CODE"
          cat /tmp/setup.json
          echo ""
          [ "$HTTP_CODE" = "200" ] || exit 1
          jq -e '.ok == true and (.nombres | index("scout") != null)' /tmp/setup.json >/dev/null
