name: "App · crear keystore Android (una sola vez)"

# Genera el keystore de firma de la app y lo guarda DIRECTAMENTE como secrets
# (nunca como artefacto: este repositorio es público y los artefactos son
# descargables). Usa el PAT guardado en VANTS_GH_PAT_SECRETS para escribir.
# Solo hay que ejecutarlo una vez: después todas las versiones se firman igual
# y las actualizaciones se instalan sin desinstalar nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generar keystore y guardarlo en secrets
        env:
          GH_TOKEN: ${{ secrets.VANTS_GH_PAT_SECRETS }}
        run: |
          set -euo pipefail
          STORE_PASS=$(openssl rand -hex 16)
          # PKCS12 (default de keytool moderno) no soporta store/key pass distintos:
          # la clave se cifra SIEMPRE con el storepass, hence una sola contraseña.
          KEY_PASS="$STORE_PASS"
          keytool -genkeypair -v \
            -keystore vants-release.jks \
            -alias vants \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=VANTS GAMES, O=VANTSGAMES, L=Caracas, C=VE"
          B64=$(base64 -w0 vants-release.jks)
          gh secret set VANTS_ANDROID_KEYSTORE --body "$B64" -R VANTSGAMES/vantsgames-web
          gh secret set VANTS_KEYSTORE_PASSWORD --body "$STORE_PASS" -R VANTSGAMES/vantsgames-web
          gh secret set VANTS_KEY_PASSWORD --body "$KEY_PASS" -R VANTSGAMES/vantsgames-web
          gh secret set VANTS_KEY_ALIAS --body "vants" -R VANTSGAMES/vantsgames-web
          echo "Keystore RSA-4096 generado y guardado como secrets (alias: vants)."
