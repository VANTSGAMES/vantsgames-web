name: "Worker vants · inspección (solo lectura)"
# Lee la configuración del Worker de producción `vants` sin modificar nada.
on:
  push:
    branches: [main]
    paths: [".github/workflows/vants-inspeccion.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    env:
      CF: https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Lista de Workers
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$CF/scripts" | jq -c '.result[] | {id, has_assets, has_modules, handlers, compatibility_date, modified_on}'
      - name: Ajustes de vants (bindings sin valores secretos)
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/settings" > s.json; jq -c "{success, errors}" s.json
          curl -sS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c ".result|{status,expires_on}"
          jq '.result | {compatibility_date, compatibility_flags, usage_model, placement, logpush, tail_consumers, observability, bindings: [.bindings[] | del(.text, .json)]}' s.json
      - name: Versiones y configuración de assets
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/deployments" | jq -c '.result.deployments[0]'
          V=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/deployments" | jq -r '.result.deployments[0].versions[0].version_id')
          curl -fsS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/versions/$V" | jq '.result | del(.resources.bindings) ' > v.json
          jq 'walk(if type=="object" then with_entries(select(.key|test("text|json|secret";"i")|not)) else . end)' v.json
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/script-settings" | jq -c .result
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/assets-upload-session" -o /dev/null -w "assets-upload-session %{http_code}\n" || true
      - name: Horarios
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vants/schedules" | jq -c .result
      - name: Inspección de vantsbot (settings, bindings, schedules y deployments)
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vantsbot/settings" > sb.json
          jq '.result | {compatibility_date, compatibility_flags, usage_model, observability, bindings: [.bindings[] | {name, type, service, database_id, text: (if .type == "plain_text" then .text else null end)}]}' sb.json
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vantsbot/schedules" | jq -c .result
          curl -sS -H "Authorization: Bearer $TOKEN" "$CF/scripts/vantsbot/deployments" | jq -c '.result.deployments[0]'
      - name: Sincronizar CLOUDFLARE_API_TOKEN válido en VANTSGAMES/vantsbot-cf y VANTSGAMES/vants-faceit-webhook
        env:
          PAT1: ${{ secrets.VANTS_GH_PAT_SECRETS }}
          PAT2: ${{ secrets.GHPAT_VANTS }}
        run: |
          for P in "$PAT1" "$PAT2"; do
            [ -z "$P" ] && continue
            if GH_TOKEN="$P" gh secret set CLOUDFLARE_API_TOKEN --repo VANTSGAMES/vantsbot-cf --body "$TOKEN"; then
              echo "CLOUDFLARE_API_TOKEN actualizado en VANTSGAMES/vantsbot-cf"
              GH_TOKEN="$P" gh workflow run deploy.yml --repo VANTSGAMES/vantsbot-cf || true
              GH_TOKEN="$P" gh secret set CLOUDFLARE_API_TOKEN --repo VANTSGAMES/vants-faceit-webhook --body "$TOKEN" || true
              GH_TOKEN="$P" gh workflow run deploy.yml --repo VANTSGAMES/vants-faceit-webhook || true
              break
            fi
          done
      - name: Inspección Fase 4 · esquema D1 real + vants-recursos + rutas torneo en vants (solo lectura)
        run: |
          set -euo pipefail
          D1="https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/d1/database/11e5d82c-307b-44ba-9682-501d8df593d3/query"
          H="Authorization: Bearer $TOKEN"
          echo "=== vants-recursos settings ==="
          curl -sS -H "$H" "$CF/scripts/vants-recursos/settings" | jq '.result | {compatibility_date, compatibility_flags, bindings: [.bindings[] | {name, type, service, database_id, class_name, workflow_name, queue_name}]}'
          echo "=== D1 PRAGMA schemas ==="
          for T in pt_torneos tournament_teams tournament_matches eventos_faceit players perfiles_publicos; do
            echo "--- TABLE: $T ---"
            curl -sS -X POST -H "$H" -H "Content-Type: application/json" "$D1" \
              -d "{\"sql\":\"PRAGMA table_info($T);\"}" | jq -c '.result[0].results // .errors'
          done
          echo "--- sqlite_master tournament/partidas tables ---"
          curl -sS -X POST -H "$H" -H "Content-Type: application/json" "$D1" \
            -d '{"sql":"SELECT name, sql FROM sqlite_master WHERE type='\''table'\'' AND (name LIKE '\''%torneo%'\'' OR name LIKE '\''%tournament%'\'' OR name LIKE '\''%match%'\'' OR name LIKE '\''%partid%'\'' OR name LIKE '\''%faceit%'\'');"}' | jq -r '.result[0].results[]? | "TABLE \(.name): \(.sql)"'
          echo "=== vants worker tournament/session handlers ==="
          node -e '
            async function getWorkerSrc(name) {
              const r = await fetch(`${process.env.CF}/scripts/${name}/content/v2`, {
                headers: { Authorization: "Bearer " + process.env.TOKEN }
              });
              const ct = r.headers.get("content-type") || "";
              const m = ct.match(/boundary=([^\r\n;]+)/i);
              const buf = Buffer.from(await r.arrayBuffer());
              if (m) {
                const sep = Buffer.from("--" + m[1].trim());
                let i = buf.indexOf(sep);
                while (i >= 0) {
                  const j = buf.indexOf(sep, i + sep.length);
                  if (j < 0) break;
                  const part = buf.subarray(i + sep.length + 2, j - 2);
                  const k = part.indexOf("\r\n\r\n");
                  if (k > 0) {
                    const hdr = part.subarray(0, k).toString("utf8");
                    const nm = (hdr.match(/name="([^"]+)"/) || [])[1] || "";
                    if (nm === "worker.js") return part.subarray(k + 4).toString("utf8");
                  }
                  i = j;
                }
              }
              return buf.toString("utf8");
            }
            (async () => {
              const lines = (await getWorkerSrc("vants")).split(/\r?\n/);
              for (let i = 0; i < lines.length; i++) {
                if (/\/api\/torneos\/bracket|\/api\/torneos\/gestionar|VANTS_AI_CORE_PROXY_V1|async function verifySesionJwt/.test(lines[i])) {
                  console.log(`--- line ${i + 1} ---`);
                  for (let k = Math.max(0, i - 2); k < Math.min(lines.length, i + 45); k++) {
                    console.log(`${k + 1}: ${lines[k]}`);
                  }
                }
              }
            })();
          '
