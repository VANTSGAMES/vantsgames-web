name: "Web · build y publicación automática"

# Publica la web en https://vants.cc:
# 1) construye el cliente de este repo (única fuente de verdad del frontend)
# 2) descarga el código de API que corre hoy en el Worker `vants` y su configuración
# 3) vuelve a desplegar ese mismo código con los archivos nuevos de la web
#    (si algo falla tras el deploy, vuelve automáticamente a la versión anterior)
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "script/ci/parchear-auth-dual.mjs"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Build del cliente (producción)
        env:
          VITE_ROUTER: history
          VITE_AUTH_ENABLED: "1"
          VITE_ASSET_ORIGIN: ""
          VITE_FN_ORIGIN: https://fn.vants.cc
          VITE_INT_ORIGIN: https://int.vants.cc
          VITE_SITE_URL: https://vants.cc
          VITE_GOOGLE_CLOUD_PROJECT_ID: semiotic-ion-508913-r1
          VITE_GOOGLE_CLOUD_PROJECT_NUMBER: "238603325169"
          VITE_GOOGLE_OAUTH_CLIENT_ID: 238603325169-k1kv9sd18gj09skun2570etpdnnkqj5b.apps.googleusercontent.com
          GCP_PROJECT_ID: semiotic-ion-508913-r1
          GCP_PROJECT_NUMBER: "238603325169"
        run: npx vite build --base=/ --outDir ../dist-web --emptyOutDir

      - name: Código y configuración actuales del Worker vants
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF: https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/vants
        run: |
          set -euo pipefail
          mkdir -p vants && cd vants
          H="Authorization: Bearer $TOKEN"
          curl -fsS -H "$H" "$CF/settings" > settings.json
          curl -fsS -H "$H" "$CF/deployments" > deployments.json
          V=$(jq -r '.result.deployments[0].versions[0].version_id' deployments.json)
          echo "ANTERIOR=$V" >> "$GITHUB_ENV"
          curl -fsS -H "$H" "$CF/versions/$V" > version.json
          curl -fsS -H "$H" "$CF/schedules" | jq -c '[.result.schedules[].cron]' > crons.json
          curl -fsS -D h.txt -H "$H" "$CF/content/v2" -o contenido.bin
          node -e '
            const fs=require("fs");
            const ct=fs.readFileSync("h.txt","utf8").match(/boundary=([^\r\n;]+)/i)[1].trim();
            const b=fs.readFileSync("contenido.bin"); const sep=Buffer.from("--"+ct);
            let i=b.indexOf(sep), n=0;
            while(i>=0){ const j=b.indexOf(sep,i+sep.length); if(j<0)break;
              const p=b.subarray(i+sep.length+2,j-2); const k=p.indexOf("\r\n\r\n");
              const cab=p.subarray(0,k).toString(); const nm=(cab.match(/name="([^"]+)"/)||[])[1];
              if(nm==="worker.js"){ fs.mkdirSync("src",{recursive:true}); fs.writeFileSync("src/worker.js",p.subarray(k+4)); n++; }
              i=j; }
            if(!n) { console.error("worker.js no encontrado"); process.exit(1); }'
          node --input-type=module --check < src/worker.js
          grep -q "export" src/worker.js
          CRONS=$(cat crons.json) WRANGLER_EXTRA='{"services":[{"binding":"VANTS_INT","service":"vants-integraciones"},{"binding":"TORNEOS_REALTIME","service":"vants-recursos"}]}' node ../script/ci/vants-config.mjs settings.json version.json ../dist-web > wrangler.json
          jq '{name, compatibility_date, vars: (.vars|keys), d1_databases, services, assets: (.assets|del(.directory)), triggers}' wrangler.json
          jq -r '[.result.bindings[].name, "VANTS_INT", "TORNEOS_REALTIME", "VANTS_INTERNAL_SECRET"] | unique | sort | join(",")' settings.json > bindings-antes.txt
          echo "bindings esperados: $(cat bindings-antes.txt)"; echo "version anterior: $V"

      - name: Parche CSP + VANTS Identity dual + cumplimiento Riot Games
        # El worker LIVE define la CSP del sitio y la verificación de sesión:
        # 1) script-src += https://static.cloudflareinsights.com (beacon de Web Analytics).
        # 2) frame-src lista cerrada (Twitch/Kick/YouTube + Google OAuth/Picker).
        # 3) Proxy first-party /auth/* -> VANTS_INT + verificación dual en infoDeSesion.
        # 4) Verificación dual en verifySesionJwt (/api/account/perfil, /api/account/progreso,
        #    clips destacados): sin ella, guardar el nick daba 401 sin_sesion.
        # 5) Cumplimiento Riot Games (App ID 907444): elimina rutas/cachés no oficiales de VALORANT y GPR.
        # 6) Proxy /api/torneos-live/sala/:id/ws y /estado -> TORNEOS_REALTIME (vants-recursos).
        # Si la línea base cambia en el futuro, falla ruidosamente.
        working-directory: vants
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const f="src/worker.js";
            let c=fs.readFileSync(f,"utf8");
            const DE1="script-src \u0027self\u0027 \u0027unsafe-inline\u0027 https://unpkg.com https://cdn.auth0.com https://accounts.google.com https://apis.google.com;";
            const DE1_PREV="script-src \u0027self\u0027 \u0027unsafe-inline\u0027 https://unpkg.com https://cdn.auth0.com https://accounts.google.com https://apis.google.com https://static.cloudflareinsights.com;";
            const A1 ="script-src \u0027self\u0027 \u0027unsafe-inline\u0027 https://unpkg.com https://cdn.auth0.com https://accounts.google.com https://apis.google.com https://maps.googleapis.com https://static.cloudflareinsights.com;";
            const DE2="frame-src \u0027self\u0027 https:;";
            const DE2_PREV="frame-src \u0027self\u0027 https://*.twitch.tv https://kick.com https://*.kick.com https://www.youtube.com https://www.youtube-nocookie.com;";
            const DE2_PREV2="frame-src \u0027self\u0027 https://*.twitch.tv https://kick.com https://*.kick.com https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com https://docs.google.com;";
            const A2 ="frame-src \u0027self\u0027 https://*.twitch.tv https://kick.com https://*.kick.com https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com https://docs.google.com https://drive.google.com https://calendar.google.com https://meet.google.com https://www.google.com;";
            if (c.includes(A1)) { console.log("CSP: script-src Google + beacon ya incluido"); }
            else if (c.includes(DE1_PREV)) { c=c.replace(DE1_PREV,A1); console.log("CSP: script-src + Google Maps"); }
            else if (c.includes(DE1)) { c=c.replace(DE1,A1); console.log("CSP: + beacon de Web Analytics + Google Maps"); }
            else { console.error("CSP script-src esperada no encontrada en el worker LIVE"); process.exit(1); }
            if (c.includes(A2)) { console.log("CSP: frame-src ya restringida con Google Workspace"); }
            else if (c.includes(DE2_PREV2)) { c=c.replace(DE2_PREV2,A2); console.log("CSP: frame-src + Google Drive/Calendar/Meet/Maps"); }
            else if (c.includes(DE2_PREV)) { c=c.replace(DE2_PREV,A2); console.log("CSP: frame-src + Google OAuth/Picker/Workspace"); }
            else if (c.includes(DE2)) { c=c.replace(DE2,A2); console.log("CSP: frame-src restringida (bloquea consentimiento de terceros)"); }
            else { console.error("CSP frame-src esperada no encontrada en el worker LIVE"); process.exit(1); }
            fs.writeFileSync(f,c);
          '
          node ../script/ci/parchear-auth-dual.mjs --vants src/worker.js
          node --input-type=module --check < src/worker.js
          grep -c "static.cloudflareinsights.com" src/worker.js
          grep -c "youtube-nocookie" src/worker.js
          grep -c "accounts.google.com" src/worker.js
          grep -c "VANTS_AUTH_PROXY_V1" src/worker.js
          grep -c "VANTS_AUTH_DUAL_V1" src/worker.js
          grep -c "VANTS_AUTH_DUAL_V2" src/worker.js
          grep -c "VANTS_SEO_KICK_ABSORB_V1" src/worker.js
          grep -c "VANTS_AI_CORE_PROXY_V1" src/worker.js
          grep -c "VANTS_RIOT_COMPLIANCE_V1" src/worker.js
          grep -c "VANTS_TORNEOS_LIVE_PROXY_V1" src/worker.js
          grep -c "VANTS_SENTINEL_AC_GATE_V1" src/worker.js
          ! grep -qiE "api\.henrikdev|HENRIKDEV_API_KEY|valorantesports\.com|parseGprHtml|handleGpr|esportsCache|gprCache|valoCacheMod|/api/valorant/rango|/api/valorant/esports|/api/gpr" src/worker.js

      - name: Prueba en seco
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
        run: npx -y wrangler@4 deploy --dry-run --outdir seco

      - name: Deploy del Worker vants (API intacta + web nueva)
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
          VANTS_INTERNAL_SECRET: ${{ secrets.VANTS_INTERNAL_SECRET }}
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy
          if [ -n "$VANTS_INTERNAL_SECRET" ]; then
            printf '%s' "$VANTS_INTERNAL_SECRET" | npx -y wrangler@4 secret put VANTS_INTERNAL_SECRET
          fi

      - name: Retirar rutas obsoletas de zona y verificar (con vuelta atrás si falla)
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          ok=1
          Z="5daba54cd10cf38639be8ba157930b50"
          H="Authorization: Bearer $TOKEN"
          for RID in $(curl -sS -H "$H" "https://api.cloudflare.com/client/v4/zones/$Z/workers/routes" | jq -r '.result[] | select(.script == "vants-kick" or .script == "vants-riot-verify" or .script == "vants-google-verify" or .script == "vants-sitemap") | .id'); do
            echo "Eliminando ruta obsoleta $RID de zona $Z"
            curl -sS -X DELETE -H "$H" "https://api.cloudflare.com/client/v4/zones/$Z/workers/routes/$RID" || true
          done
          sleep 8
          D=$(curl -fsS -H "$H" https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/vants/settings | jq -r '[.result.bindings[].name]|sort|join(",")')
          [ "$D" = "$(cat bindings-antes.txt)" ] || { echo "Bindings distintos: $D"; ok=0; }
          U=https://vants.cc
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/); [ "$c" = 200 ] || { echo "/ -> $c"; ok=0; }
          c=$(curl -s -A ci -o r.json -w '%{http_code}' $U/api/tournaments); [ "$c" = 200 ] && jq -e '.ok == true' r.json >/dev/null || { echo "/api/tournaments -> $c"; ok=0; }
          c=$(curl -s -A ci -o sala.json -w '%{http_code}' $U/api/torneos-live/sala/smoke/estado); [ "$c" = 200 ] && jq -e '.ok == true' sala.json >/dev/null || { echo "/api/torneos-live/sala/smoke/estado -> $c"; ok=0; }
          c=$(curl -s -A ci -o jwks.json -w '%{http_code}' $U/auth/.well-known/jwks.json); [ "$c" = 200 ] && jq -e '.keys[0].kid' jwks.json >/dev/null || { echo "/auth/.well-known/jwks.json -> $c"; ok=0; }
          c=$(curl -s -A ci -o oidc.json -w '%{http_code}' $U/.well-known/openid-configuration); [ "$c" = 200 ] && jq -e '.issuer' oidc.json >/dev/null || { echo "/.well-known/openid-configuration -> $c"; ok=0; }
          gs=$(curl -s -A ci -o /dev/null -w '%{http_code} %{redirect_url}' $U/auth/google/start)
          case "$gs" in "302 https://accounts.google.com/o/oauth2/v2/auth"*) ;; *) echo "/auth/google/start -> $gs"; ok=0 ;; esac
          c=$(curl -s -A ci -o riot.txt -w '%{http_code}|%{content_type}' $U/riot.txt)
          case "$c" in "200|text/plain"*) ;; *) echo "/riot.txt -> $c"; ok=0 ;; esac
          [ "$(cat riot.txt)" = "383dea30-3123-4203-b2f8-367829724230" ] || { echo "/riot.txt body inesperado"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/googlec8812910616d7748.html); [ "$c" = 200 ] || { echo "/googlec8812910616d7748.html -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/sitemap.xml); [ "$c" = 200 ] || { echo "/sitemap.xml -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/kick/webhook); [ "$c" = 410 ] || { echo "/kick/webhook -> $c"; ok=0; }
          c=$(curl -s -A ci -o ai.json -w '%{http_code}' $U/api/ai/estado); [ "$c" = 401 ] && jq -e '.error == "sin_sesion"' ai.json >/dev/null || { echo "/api/ai/estado (sin sesión) -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/insignias/socio.png); [ "$c" = 200 ] || { echo "/insignias/socio.png -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/perfil/cuentas); [ "$c" = 200 ] || { echo "/perfil/cuentas -> $c"; ok=0; }
          c=$(curl -s -A ci -o acc.json -w '%{http_code}' $U/api/account/perfil); [ "$c" = 401 ] && jq -e '.error == "sin_sesion"' acc.json >/dev/null || { echo "/api/account/perfil (sin sesión) -> $c"; ok=0; }
          if [ $ok = 1 ]; then
            for W in vants-riot-verify vants-google-verify vants-sitemap vants-kick; do
              echo "Eliminando Worker obsoleto $W"
              curl -sS -X DELETE -H "$H" "https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/$W" || true
            done
            echo "Producción OK (Fase 4 Torneos Realtime + Árbitro/Caster IA + Riot compliance verificados)"
            exit 0
          fi
          echo "Fallo: vuelvo a la versión $ANTERIOR"
          npx -y wrangler@4 rollback "$ANTERIOR" --message "auto-rollback web-deploy" -y
          exit 1
