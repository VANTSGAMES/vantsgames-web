name: "Web · build y publicación automática"

# Publica la web en https://vants.cc:
# 1) construye el cliente de este repo (única fuente de verdad del frontend)
# 2) descarga el código de API que corre hoy en el Worker `vants` y su configuración
# 3) vuelve a desplegar ese mismo código con los archivos nuevos de la web
#    (si algo falla tras el deploy, vuelve automáticamente a la versión anterior)
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Build del cliente (producción)
        env:
          VITE_ROUTER: history
          VITE_AUTH_ENABLED: "1"
          VITE_ASSET_ORIGIN: ""
          VITE_FN_ORIGIN: https://vants-functions.vants.workers.dev
          VITE_AUTH0_CLIENT_ID: totrP3GBWQpdi7IqWv2zhbVLe0xSyaMo
          VITE_SITE_URL: https://vants.cc
          VITE_GOOGLE_CLOUD_PROJECT_ID: semiotic-ion-508913-r1
          VITE_GOOGLE_OAUTH_CLIENT_ID: 238603325169-k1kv9sd18gj09skun2570etpdnnkqj5b.apps.googleusercontent.com
        run: npx vite build --base=/ --outDir ../dist-web --emptyOutDir

      - name: Código y configuración actuales del Worker vants
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF: https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/vants
        run: |
          set -euo pipefail
          mkdir -p vants && cd vants
          H="Authorization: Bearer $TOKEN"
          curl -fsS -H "$H" "$CF/settings" > settings.json
          curl -fsS -H "$H" "$CF/deployments" > deployments.json
          V=$(jq -r '.result.deployments[0].versions[0].version_id' deployments.json)
          echo "ANTERIOR=$V" >> "$GITHUB_ENV"
          curl -fsS -H "$H" "$CF/versions/$V" > version.json
          curl -fsS -H "$H" "$CF/schedules" | jq -c '[.result.schedules[].cron]' > crons.json
          curl -fsS -D h.txt -H "$H" "$CF/content/v2" -o contenido.bin
          node -e '
            const fs=require("fs");
            const ct=fs.readFileSync("h.txt","utf8").match(/boundary=([^\r\n;]+)/i)[1].trim();
            const b=fs.readFileSync("contenido.bin"); const sep=Buffer.from("--"+ct);
            let i=b.indexOf(sep), n=0;
            while(i>=0){ const j=b.indexOf(sep,i+sep.length); if(j<0)break;
              const p=b.subarray(i+sep.length+2,j-2); const k=p.indexOf("\r\n\r\n");
              const cab=p.subarray(0,k).toString(); const nm=(cab.match(/name="([^"]+)"/)||[])[1];
              if(nm==="worker.js"){ fs.mkdirSync("src",{recursive:true}); fs.writeFileSync("src/worker.js",p.subarray(k+4)); n++; }
              i=j; }
            if(!n) { console.error("worker.js no encontrado"); process.exit(1); }'
          node --input-type=module --check < src/worker.js
          grep -q "export" src/worker.js
          CRONS=$(cat crons.json) node ../script/ci/vants-config.mjs settings.json version.json ../dist-web > wrangler.json
          jq '{name, compatibility_date, vars: (.vars|keys), d1_databases, assets: (.assets|del(.directory)), triggers}' wrangler.json
          jq -r '[.result.bindings[].name]|sort|join(",")' settings.json > bindings-antes.txt
          echo "bindings: $(cat bindings-antes.txt)"; echo "version anterior: $V"

      - name: Parche CSP del worker (beacon + bloqueo de consentimiento de terceros)
        # El worker LIVE define la CSP del sitio. Dos ajustes idempotentes:
        # 1) script-src += https://static.cloudflareinsights.com (beacon de Web Analytics,
        #    si no el navegador lo bloquea).
        # 2) frame-src 'self' https: -> lista cerrada (Twitch/Kick/YouTube + Google OAuth/Picker).
        #    El GTM roto de Zaraz abre un iframe de consentimiento de Google (fondo blanco) que
        #    tapa la web en móvil; con lista cerrada no puede cargarse.
        # Si la línea base cambia en el futuro, falla ruidosamente.
        working-directory: vants
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const f="src/worker.js";
            let c=fs.readFileSync(f,"utf8");
            const DE1="script-src \u0027self\u0027 \u0027unsafe-inline\u0027 https://unpkg.com https://cdn.auth0.com https://accounts.google.com https://apis.google.com;";
            const A1 ="script-src \u0027self\u0027 \u0027unsafe-inline\u0027 https://unpkg.com https://cdn.auth0.com https://accounts.google.com https://apis.google.com https://static.cloudflareinsights.com;";
            const DE2="frame-src \u0027self\u0027 https:;";
            const DE2_PREV="frame-src \u0027self\u0027 https://*.twitch.tv https://kick.com https://*.kick.com https://www.youtube.com https://www.youtube-nocookie.com;";
            const A2 ="frame-src \u0027self\u0027 https://*.twitch.tv https://kick.com https://*.kick.com https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com https://docs.google.com;";
            if (c.includes(A1)) { console.log("CSP: beacon ya incluido"); }
            else if (!c.includes(DE1)) { console.error("CSP script-src esperada no encontrada en el worker LIVE"); process.exit(1); }
            else { c=c.replace(DE1,A1); console.log("CSP: + beacon de Web Analytics"); }
            if (c.includes(A2)) { console.log("CSP: frame-src ya restringida con Google OAuth/Picker"); }
            else if (c.includes(DE2_PREV)) { c=c.replace(DE2_PREV,A2); console.log("CSP: frame-src + Google OAuth/Picker"); }
            else if (c.includes(DE2)) { c=c.replace(DE2,A2); console.log("CSP: frame-src restringida (bloquea consentimiento de terceros)"); }
            else { console.error("CSP frame-src esperada no encontrada en el worker LIVE"); process.exit(1); }
            fs.writeFileSync(f,c);
          '
          grep -c "static.cloudflareinsights.com" src/worker.js
          grep -c "youtube-nocookie" src/worker.js
          grep -c "accounts.google.com" src/worker.js

      - name: Prueba en seco
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
        run: npx -y wrangler@4 deploy --dry-run --outdir seco

      - name: Deploy del Worker vants (API intacta + web nueva)
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
        run: npx -y wrangler@4 deploy

      - name: Verificación (y vuelta atrás si falla)
        working-directory: vants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          ok=1
          sleep 8
          D=$(curl -fsS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/vants/settings | jq -r '[.result.bindings[].name]|sort|join(",")')
          [ "$D" = "$(cat bindings-antes.txt)" ] || { echo "Bindings distintos: $D"; ok=0; }
          U=https://vants.cc
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/); [ "$c" = 200 ] || { echo "/ -> $c"; ok=0; }
          c=$(curl -s -A ci -o r.json -w '%{http_code}' $U/api/gpr); [ "$c" = 200 ] && jq -e .ok r.json >/dev/null || { echo "/api/gpr -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/insignias/socio.png); [ "$c" = 200 ] || { echo "/insignias/socio.png -> $c"; ok=0; }
          c=$(curl -s -A ci -o /dev/null -w '%{http_code}' $U/perfil/cuentas); [ "$c" = 200 ] || { echo "/perfil/cuentas -> $c"; ok=0; }
          if [ $ok = 1 ]; then echo "Producción OK"; exit 0; fi
          echo "Fallo: vuelvo a la versión $ANTERIOR"
          npx -y wrangler@4 rollback "$ANTERIOR" --message "auto-rollback web-deploy" -y
          exit 1
