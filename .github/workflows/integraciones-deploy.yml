name: Integraciones · deploy del Worker (vants-integraciones)
on:
  push:
    branches: [main]
    paths: ["integraciones/**", ".github/workflows/integraciones-deploy.yml"]
  workflow_dispatch:
concurrency: { group: integraciones-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: integraciones } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sintaxis
        run: |
          node --check src/index.js
          node --check src/vantsAi.js
          node --check src/comms.js
      - name: Migraciones D1 (idempotentes)
        run: |
          for f in migraciones/*.sql; do
            npx -y wrangler@4 d1 execute vants-db --remote --file "$f" --yes || {
              echo "::warning::No se pudo ejecutar $f (revisa permiso Account -> D1 -> Edit en CLOUDFLARE_API_TOKEN); continuando con deploy."
              break
            }
          done
      - name: Deploy
        run: npx -y wrangler@4 deploy
      - name: Secretos de Epic / Fortnite, VANTS Identity y VANTS Core AI
        env:
          EPIC_CLIENT_SECRET: ${{ secrets.EPIC_CLIENT_SECRET }}
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
          VANTS_AUTH_PRIVATE_JWK: ${{ secrets.VANTS_AUTH_PRIVATE_JWK }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VIDIQ_MCP_TOKEN: ${{ secrets.VIDIQ_MCP_TOKEN }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          VANTS_BUS_SECRET: ${{ secrets.VANTS_BUS_SECRET }}
          VANTS_INTERNAL_SECRET: ${{ secrets.VANTS_INTERNAL_SECRET }}
        run: |
          if [ -n "$EPIC_CLIENT_SECRET" ]; then printf '%s' "$EPIC_CLIENT_SECRET" | npx -y wrangler@4 secret put EPIC_CLIENT_SECRET; fi
          if [ -n "$FORTNITE_API_KEY" ]; then printf '%s' "$FORTNITE_API_KEY" | npx -y wrangler@4 secret put FORTNITE_API_KEY; fi
          if [ -n "$VANTS_AUTH_PRIVATE_JWK" ]; then printf '%s' "$VANTS_AUTH_PRIVATE_JWK" | npx -y wrangler@4 secret put VANTS_AUTH_PRIVATE_JWK; fi
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | npx -y wrangler@4 secret put GOOGLE_OAUTH_CLIENT_SECRET; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx -y wrangler@4 secret put RESEND_API_KEY; fi
          if [ -n "$VIDIQ_MCP_TOKEN" ]; then printf '%s' "$VIDIQ_MCP_TOKEN" | npx -y wrangler@4 secret put VIDIQ_MCP_TOKEN; fi
          if [ -n "$PAGERDUTY_ROUTING_KEY" ]; then printf '%s' "$PAGERDUTY_ROUTING_KEY" | npx -y wrangler@4 secret put PAGERDUTY_ROUTING_KEY; fi
          if [ -n "$DD_API_KEY" ]; then printf '%s' "$DD_API_KEY" | npx -y wrangler@4 secret put DD_API_KEY; fi
          if [ -n "$GEMINI_API_KEY" ]; then printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@4 secret put GEMINI_API_KEY; fi
          if [ -n "$AI_GATEWAY_URL" ]; then printf '%s' "$AI_GATEWAY_URL" | npx -y wrangler@4 secret put AI_GATEWAY_URL; fi
          if [ -n "$VANTS_BUS_SECRET" ]; then printf '%s' "$VANTS_BUS_SECRET" | npx -y wrangler@4 secret put VANTS_BUS_SECRET; fi
          if [ -n "$VANTS_INTERNAL_SECRET" ]; then printf '%s' "$VANTS_INTERNAL_SECRET" | npx -y wrangler@4 secret put VANTS_INTERNAL_SECRET; fi
      - name: Sincronizar secretos compartidos en GitHub y Cloudflare (idempotente, sin exponer valores)
        env:
          PAT1: ${{ secrets.VANTS_GH_PAT_SECRETS }}
          PAT2: ${{ secrets.GHPAT_VANTS }}
          GH_VANTS_BUS_SECRET: ${{ secrets.VANTS_BUS_SECRET }}
          GH_VANTS_INTERNAL_SECRET: ${{ secrets.VANTS_INTERNAL_SECRET }}
          GH_AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
        run: |
          node -e '
            const crypto = require("node:crypto");
            const { spawnSync } = require("node:child_process");
            const acct = process.env.CLOUDFLARE_ACCOUNT_ID;
            const tok = process.env.CLOUDFLARE_API_TOKEN;
            const api = `https://api.cloudflare.com/client/v4/accounts/${acct}/workers/scripts`;
            const hdr = { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" };

            function findWorkingPat() {
              for (const p of [process.env.PAT1, process.env.PAT2]) {
                if (!p) continue;
                const r = spawnSync("gh", ["secret", "list", "--repo", "VANTSGAMES/vantsgames-web"], {
                  env: { ...process.env, GH_TOKEN: p },
                  encoding: "utf8",
                });
                if (r.status === 0) return p;
              }
              return null;
            }

            function ghListSecrets(pat, repo) {
              const r = spawnSync("gh", ["secret", "list", "--repo", repo, "--json", "name"], {
                env: { ...process.env, GH_TOKEN: pat },
                encoding: "utf8",
              });
              if (r.status !== 0) throw new Error(`gh secret list ${repo}: ${r.stderr}`);
              return new Set(JSON.parse(r.stdout || "[]").map((x) => x.name));
            }

            function ghSetSecret(pat, repo, name, value) {
              const r = spawnSync("gh", ["secret", "set", name, "--repo", repo], {
                input: value,
                env: { ...process.env, GH_TOKEN: pat },
                encoding: "utf8",
              });
              if (r.status !== 0) throw new Error(`gh secret set ${repo}/${name}: ${r.stderr}`);
            }

            async function cfGetSecretNames(script) {
              const r = await fetch(`${api}/${script}/settings`, { headers: hdr });
              const j = await r.json().catch(() => null);
              if (!r.ok || !j?.success) throw new Error(`settings ${script}: HTTP ${r.status}`);
              return new Set((j.result?.bindings || []).filter((b) => b.type === "secret_text").map((b) => b.name));
            }

            async function cfPutSecret(script, name, text) {
              const r = await fetch(`${api}/${script}/secrets`, {
                method: "PUT",
                headers: hdr,
                body: JSON.stringify({ name, text, type: "secret_text" }),
              });
              const j = await r.json().catch(() => null);
              if (!r.ok || !j?.success) throw new Error(`putSecret ${script}/${name}: HTTP ${r.status}`);
            }

            (async () => {
              const pat = findWorkingPat();
              const ghWeb = pat ? ghListSecrets(pat, "VANTSGAMES/vantsgames-web") : new Set();
              const ghBot = pat ? ghListSecrets(pat, "VANTSGAMES/vantsbot-cf") : new Set();
              const [cfBus, cfInt, cfBot] = await Promise.all([
                cfGetSecretNames("vants-bus"),
                cfGetSecretNames("vants-integraciones"),
                cfGetSecretNames("vantsbot"),
              ]);

              // 1) Par VantsBus AI: VANTS_BUS_SECRET (web GH + vants-integraciones CF) <-> SECRET_VANTS_AI (vants-bus CF)
              const existingBus = process.env.GH_VANTS_BUS_SECRET || "";
              if (existingBus && cfBus.has("SECRET_VANTS_AI") && cfInt.has("VANTS_BUS_SECRET")) {
                console.log("[ok] VantsBus AI: ya presente en GitHub (vantsgames-web) y Cloudflare (vants-bus + vants-integraciones).");
              } else {
                const val = existingBus || crypto.randomBytes(32).toString("hex");
                if (pat && !existingBus) {
                  ghSetSecret(pat, "VANTSGAMES/vantsgames-web", "VANTS_BUS_SECRET", val);
                  ghSetSecret(pat, "VANTSGAMES/vantsgames-web", "SECRET_VANTS_AI", val);
                }
                await cfPutSecret("vants-bus", "SECRET_VANTS_AI", val);
                await cfPutSecret("vants-integraciones", "VANTS_BUS_SECRET", val);
                console.log(`[sync] VantsBus AI: sincronizado en GitHub (${Boolean(pat)}) y Cloudflare (vants-bus:SECRET_VANTS_AI + vants-integraciones:VANTS_BUS_SECRET).`);
              }

              // 2) Par Puente Interno AI: VANTS_INTERNAL_SECRET (web GH + bot GH + vants-integraciones CF + vantsbot CF)
              const existingInt = process.env.GH_VANTS_INTERNAL_SECRET || "";
              if (existingInt && ghBot.has("VANTS_INTERNAL_SECRET") && cfInt.has("VANTS_INTERNAL_SECRET") && cfBot.has("VANTS_INTERNAL_SECRET")) {
                console.log("[ok] Puente interno AI: ya presente en ambos repos GitHub y ambos Workers Cloudflare.");
              } else {
                const val = existingInt || crypto.randomBytes(32).toString("hex");
                if (pat) {
                  if (!existingInt) ghSetSecret(pat, "VANTSGAMES/vantsgames-web", "VANTS_INTERNAL_SECRET", val);
                  if (!ghBot.has("VANTS_INTERNAL_SECRET") || !existingInt) ghSetSecret(pat, "VANTSGAMES/vantsbot-cf", "VANTS_INTERNAL_SECRET", val);
                }
                await cfPutSecret("vants-integraciones", "VANTS_INTERNAL_SECRET", val);
                await cfPutSecret("vantsbot", "VANTS_INTERNAL_SECRET", val);
                console.log(`[sync] Puente interno AI: sincronizado en GitHub (${Boolean(pat)}: vantsgames-web + vantsbot-cf) y Cloudflare (vants-integraciones + vantsbot).`);
              }

              // 3) Detectar si existe un Cloudflare AI Gateway en la cuenta para AI_GATEWAY_URL
              const existingGw = process.env.GH_AI_GATEWAY_URL || "";
              if (!existingGw && !cfInt.has("AI_GATEWAY_URL")) {
                const gwRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${acct}/ai-gateway/gateways`, { headers: hdr }).catch(() => null);
                const gwJson = gwRes ? await gwRes.json().catch(() => null) : null;
                const gws = Array.isArray(gwJson?.result) ? gwJson.result : [];
                if (gws.length > 0) {
                  const gw = gws.find((g) => /vants/i.test(String(g.id || ""))) || gws[0];
                  const gwUrl = `https://gateway.ai.cloudflare.com/v1/${acct}/${gw.id}/google-ai-studio/v1beta/models`;
                  if (pat) ghSetSecret(pat, "VANTSGAMES/vantsgames-web", "AI_GATEWAY_URL", gwUrl);
                  await cfPutSecret("vants-integraciones", "AI_GATEWAY_URL", gwUrl);
                  console.log(`[sync] AI_GATEWAY_URL detectado y cargado para gateway "${gw.id}" en GitHub y Cloudflare.`);
                } else {
                  console.log(`[info] Sin AI Gateway configurado en Cloudflare (HTTP ${gwRes?.status ?? "err"}); usando Gemini directo.`);
                }
              } else {
                console.log(`[ok] AI_GATEWAY_URL estado -> GitHub: ${Boolean(existingGw)}, Cloudflare: ${cfInt.has("AI_GATEWAY_URL")}.`);
              }

              console.log(`[estado] GEMINI_API_KEY -> Cloudflare(vants-integraciones): ${cfInt.has("GEMINI_API_KEY")}, GitHub(vantsgames-web): ${ghWeb.has("GEMINI_API_KEY")}`);
              console.log(`[estado] VANTS_BOT_SECRET -> Cloudflare(vantsbot): ${cfBot.has("VANTS_BOT_SECRET")}, GitHub(vantsbot-cf): ${ghBot.has("VANTS_BOT_SECRET")}`);
            })().catch((e) => { console.error(String(e)); process.exit(1); });
          '
      - name: Salud
        run: curl -fsS -A "Mozilla/5.0 (compatible; VANTSHealthCheck/1.0; +https://vants.cc)" https://vants-integraciones.vants.workers.dev/salud
      - name: Prueba de latencia AI (/ai/estado y /ai/scout/jugador)
        env:
          VANTS_INTERNAL_SECRET: ${{ secrets.VANTS_INTERNAL_SECRET }}
        run: |
          if [ -z "$VANTS_INTERNAL_SECRET" ]; then
            echo "[skip] VANTS_INTERNAL_SECRET no presente en GitHub Secrets"
            exit 0
          fi
          node -e '
            const sec = process.env.VANTS_INTERNAL_SECRET;
            const ua = "Mozilla/5.0 (compatible; VANTSHealthCheck/1.0; +https://vants.cc)";
            const base = "https://int.vants.cc";
            const hdr = {
              "User-Agent": ua,
              "Content-Type": "application/json",
              "X-Vants-Internal": sec,
              "X-Vants-Staff": "1",
            };
            (async () => {
              const t0 = Date.now();
              const rEst = await fetch(`${base}/ai/estado`, { headers: hdr });
              const dEst = await rEst.json().catch(() => null);
              console.log("[latencia:/ai/estado]", JSON.stringify({
                status: rEst.status,
                elapsedMs: Date.now() - t0,
                ok: dEst?.ok,
                configurado: dEst?.configurado,
                modelos: dEst?.modelos,
                bus: dEst?.bus,
              }));

              // Buscar primer jugador público para probar /ai/scout/jugador real
              const rJug = await fetch(`${base}/jugadores`, { headers: { "User-Agent": ua } });
              const dJug = await rJug.json().catch(() => null);
              const first = (dJug?.jugadores || [])[0];
              if (!first) {
                console.log("[latencia:/ai/scout/jugador] sin jugadores públicos en D1");
                return;
              }
              const t1 = Date.now();
              const rSc = await fetch(`${base}/ai/scout/jugador`, {
                method: "POST",
                headers: hdr,
                body: JSON.stringify({ pid: first.pid, nick: first.nick }),
              });
              const dSc = await rSc.json().catch(() => null);
              console.log("[latencia:/ai/scout/jugador]", JSON.stringify({
                status: rSc.status,
                elapsedMs: Date.now() - t1,
                ok: dSc?.ok,
                modelo: dSc?.modelo,
                jugador: dSc?.jugador?.nick || first.nick,
                score: dSc?.reporte?.performance_score,
                tier: dSc?.reporte?.tier_sugerido,
                error: dSc?.error,
                paso: dSc?.paso,
              }));
            })().catch((e) => console.error("[latencia:error]", String(e)));
          '
