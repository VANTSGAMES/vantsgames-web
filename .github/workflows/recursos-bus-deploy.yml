name: "Recursos y Bus · deploy de vants-recursos y vants-bus"

# Despliega los parches de seguridad/workflow en `vants-recursos` (cloudflare/)
# y la limpieza ISO por `ts < ?` en `vants-bus` conservando todos sus bindings,
# variables, secretos y crons.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/recursos-bus-deploy.yml"
  workflow_dispatch:

concurrency: { group: recursos-bus-deploy, cancel-in-progress: false }

permissions:
  contents: read

jobs:
  deploy-recursos:
    name: Deploy vants-recursos (torneos-realtime)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloudflare } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generar wrangler.jsonc con D1 real (vants-db) y Service Bindings
        run: |
          set -euo pipefail
          sed 's/PEGA_AQUI_EL_ID_DE_LA_D1/11e5d82c-307b-44ba-9682-501d8df593d3/g; s/"database_name": "vants"/"database_name": "vants-db"/g' wrangler.ejemplo.jsonc > wrangler.jsonc
      - name: Typecheck TypeScript (cloudflare/tsconfig.json)
        run: |
          npm i --no-save --no-audit --no-fund typescript @cloudflare/workers-types
          npx tsc -p tsconfig.json
      - name: Prueba en seco vants-recursos
        run: npx -y wrangler@4 deploy --dry-run --outdir seco
      - name: Deploy vants-recursos
        run: npx -y wrangler@4 deploy
      - name: Sincronizar secretos VANTS_INTERNAL_SECRET y TORNEOS_ADMIN_SECRET (sin exponer valores)
        env:
          GH_VANTS_INTERNAL_SECRET: ${{ secrets.VANTS_INTERNAL_SECRET }}
          GH_TORNEOS_ADMIN_SECRET: ${{ secrets.TORNEOS_ADMIN_SECRET }}
          PAT1: ${{ secrets.VANTS_GH_PAT_SECRETS }}
          PAT2: ${{ secrets.GHPAT_VANTS }}
        run: |
          set -euo pipefail
          node -e '
            const crypto = require("node:crypto");
            const { spawnSync } = require("node:child_process");
            const acct = process.env.CLOUDFLARE_ACCOUNT_ID;
            const tok = process.env.CLOUDFLARE_API_TOKEN;
            const api = `https://api.cloudflare.com/client/v4/accounts/${acct}/workers/scripts/vants-recursos`;
            const hdr = { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" };

            async function cfGetSecretNames() {
              const r = await fetch(`${api}/settings`, { headers: hdr });
              const j = await r.json().catch(() => null);
              if (!r.ok || !j?.success) throw new Error(`settings vants-recursos: HTTP ${r.status}`);
              return new Set((j.result?.bindings || []).filter((b) => b.type === "secret_text").map((b) => b.name));
            }
            async function cfPutSecret(name, text) {
              const r = await fetch(`${api}/secrets`, {
                method: "PUT",
                headers: hdr,
                body: JSON.stringify({ name, text, type: "secret_text" }),
              });
              const j = await r.json().catch(() => null);
              if (!r.ok || !j?.success) throw new Error(`put ${name}: HTTP ${r.status}`);
            }
            function findPat() {
              for (const p of [process.env.PAT1, process.env.PAT2]) {
                if (!p) continue;
                const r = spawnSync("gh", ["secret", "list", "--repo", "VANTSGAMES/vantsgames-web"], {
                  env: { ...process.env, GH_TOKEN: p },
                  encoding: "utf8",
                });
                if (r.status === 0) return p;
              }
              return null;
            }
            (async () => {
              const cfSecrets = await cfGetSecretNames();
              const intSec = String(process.env.GH_VANTS_INTERNAL_SECRET || "").trim();
              if (intSec) {
                await cfPutSecret("VANTS_INTERNAL_SECRET", intSec);
                console.log("VANTS_INTERNAL_SECRET sincronizado en vants-recursos");
              } else {
                console.log("VANTS_INTERNAL_SECRET en vants-recursos:", cfSecrets.has("VANTS_INTERNAL_SECRET") ? "ya existe" : "pendiente");
              }

              const admSec = String(process.env.GH_TORNEOS_ADMIN_SECRET || "").trim();
              if (admSec) {
                await cfPutSecret("TORNEOS_ADMIN_SECRET", admSec);
                console.log("TORNEOS_ADMIN_SECRET sincronizado desde GitHub Secret en vants-recursos");
              } else if (!cfSecrets.has("TORNEOS_ADMIN_SECRET")) {
                const generado = crypto.randomBytes(32).toString("hex");
                await cfPutSecret("TORNEOS_ADMIN_SECRET", generado);
                console.log("TORNEOS_ADMIN_SECRET generado y cargado en vants-recursos");
                const pat = findPat();
                if (pat) {
                  const r = spawnSync("gh", ["secret", "set", "TORNEOS_ADMIN_SECRET", "--repo", "VANTSGAMES/vantsgames-web"], {
                    input: generado,
                    env: { ...process.env, GH_TOKEN: pat },
                    encoding: "utf8",
                  });
                  if (r.status === 0) console.log("TORNEOS_ADMIN_SECRET guardado en GitHub Secrets (VANTSGAMES/vantsgames-web)");
                }
              } else {
                console.log("TORNEOS_ADMIN_SECRET ya existe en vants-recursos (preservado)");
              }
            })().catch((e) => { console.error(e.message || e); process.exit(1); });
          '
      - name: Verificar salud, bindings y cierre de rutas de control
        run: |
          set -euo pipefail
          sleep 4
          U="https://vants-recursos.vants.workers.dev"
          curl -fsS "$U/salud" | tee salud.json
          jq -e '.ok == true and .bindings.db == true and .bindings.sala == true and .bindings.workflow == true and .bindings.queue == true and .bindings.ai == true and .bindings.bus == true and .secretos.admin == true and .secretos.internal == true' salud.json >/dev/null
          curl -fsS "$U/sala/smoke/estado" | jq -e '.ok == true' >/dev/null
          c=$(curl -s -X POST -o /dev/null -w '%{http_code}' "$U/webhooks/faceit")
          echo "/webhooks/faceit sin secreto -> $c"
          case "$c" in 401|503) ;; *) echo "Se esperaba 401 o 503, recibido $c"; exit 1 ;; esac
          for route in "GET /torneos/test/estado-instancia" "POST /torneos/test/iniciar" "POST /torneos/test/aviso"; do
            m=${route%% *}; p=${route#* }
            cc=$(curl -s -X "$m" -o /dev/null -w '%{http_code}' "$U$p")
            echo "$m $p sin secreto -> $cc"
            [ "$cc" = "401" ] || { echo "Se esperaba 401, recibido $cc"; exit 1; }
          done

  deploy-bus:
    name: Deploy vants-bus (deleteOlderThan ts < ?)
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8f2424e95fec4860e19257226f209fbc
      CF: https://api.cloudflare.com/client/v4/accounts/8f2424e95fec4860e19257226f209fbc/workers/scripts/vants-bus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Descargar, parchear y desplegar vants-bus
        run: |
          set -euo pipefail
          mkdir -p bus && cd bus
          H="Authorization: Bearer $TOKEN"
          curl -fsS -H "$H" "$CF/settings" > settings.json
          curl -fsS -H "$H" "$CF/schedules" | jq -c '[.result.schedules[].cron]' > crons.json
          curl -fsS -D h.txt -H "$H" "$CF/content/v2" -o contenido.bin
          node -e '
            const fs = require("fs");
            const ct = fs.readFileSync("h.txt", "utf8").match(/boundary=([^\r\n;]+)/i)[1].trim();
            const b = fs.readFileSync("contenido.bin");
            const sep = Buffer.from("--" + ct);
            let i = b.indexOf(sep), n = 0;
            while (i >= 0) {
              const j = b.indexOf(sep, i + sep.length);
              if (j < 0) break;
              const p = b.subarray(i + sep.length + 2, j - 2);
              const k = p.indexOf("\r\n\r\n");
              const cab = p.subarray(0, k).toString();
              const nm = (cab.match(/name="([^"]+)"/) || [])[1];
              if (nm === "index.js" || nm === "worker.js") {
                fs.mkdirSync("src", { recursive: true });
                let code = p.subarray(k + 4).toString("utf8");
                code = code.replace(
                  "DELETE FROM vants_events WHERE created_at < ?",
                  "DELETE FROM vants_events WHERE ts < ?"
                );
                if (!code.includes("DELETE FROM vants_events WHERE ts < ?")) {
                  console.error("No se encontró la consulta de deleteOlderThan en vants-bus");
                  process.exit(1);
                }
                fs.writeFileSync("src/index.js", code, "utf8");
                n++;
              }
              i = j;
            }
            if (!n) { console.error("Módulo principal no encontrado en vants-bus"); process.exit(1); }
          '
          node --input-type=module --check < src/index.js
          node -e '
            const fs = require("fs");
            const set = JSON.parse(fs.readFileSync("settings.json", "utf8")).result;
            const crons = JSON.parse(fs.readFileSync("crons.json", "utf8"));
            const vars = {}, d1 = [];
            for (const b of set.bindings || []) {
              if (b.type === "plain_text") vars[b.name] = b.text;
              else if (b.type === "json") vars[b.name] = b.json;
              else if (b.type === "d1") d1.push({ binding: b.name, database_id: b.database_id || b.id });
              else if (b.type === "secret_text" || b.type === "secret_key") {}
              else throw new Error("Binding no soportado en vants-bus: " + b.type + ":" + b.name);
            }
            const cfg = {
              name: "vants-bus",
              main: "src/index.js",
              no_bundle: true,
              compatibility_date: set.compatibility_date || "2025-01-01",
              compatibility_flags: set.compatibility_flags || [],
              workers_dev: true,
              keep_vars: false,
              vars,
              d1_databases: d1,
              triggers: { crons },
            };
            fs.writeFileSync("wrangler.json", JSON.stringify(cfg, null, 2));
          '
          jq -r '[.result.bindings[].name]|sort|join(",")' settings.json > bindings-antes.txt
          npx -y wrangler@4 deploy --dry-run --outdir seco
          npx -y wrangler@4 deploy
          sleep 4
          D=$(curl -fsS -H "$H" "$CF/settings" | jq -r '[.result.bindings[].name]|sort|join(",")')
          [ "$D" = "$(cat bindings-antes.txt)" ] || { echo "Bindings distintos en vants-bus: $D"; exit 1; }
          curl -fsS https://vants-bus.vants.workers.dev/health | jq -e '.ok == true'
