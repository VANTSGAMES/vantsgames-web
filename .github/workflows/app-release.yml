name: "App Android · APK + AAB firmado (VANTS Movil)"

# Construye la aplicación completa VANTS Movil (Android + Tablets) directamente
# desde este repositorio (100% in-app: login, perfil del jugador, lanzador de
# juegos para torneos, experiencia/XP e insignia oficial de Google Play Juegos),
# la firma con el keystore de producción y publica el .aab (Google Play Store) y
# el .apk en GitHub Releases.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - "script/ci/setup-android.mjs"
      - "script/ci/app-icono.mjs"
      - "capacitor.config.ts"
      - ".github/workflows/app-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión móvil (x.y.z)"
        required: true
        default: "1.4.0"
      codigo:
        description: "versionCode Android (entero creciente >= 320)"
        required: false
        default: "320"

concurrency:
  group: app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Calcular versión móvil y versionCode monotónico (aislado de PC)
        id: meta
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then VER="1.4.${{ github.run_number }}"; fi
          MIN_COD=$((320 + ${{ github.run_number }}))
          COD="${{ inputs.codigo }}"
          if [ -z "$COD" ] || [ "$COD" -lt "$MIN_COD" ] 2>/dev/null; then
            COD="$MIN_COD"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "codigo=$COD" >> "$GITHUB_OUTPUT"
          echo "Compilando VANTS Movil (canal exclusivo Android/Tablet) v$VER · versionCode $COD"

      - name: Instalar dependencias del proyecto
        run: npm ci --no-audit --no-fund

      - name: Compilar bundle nativo 100% in-app (VANTS Movil · Android / iOS / Tablet)
        env:
          VITE_ROUTER: hash
          VITE_AUTH_ENABLED: "1"
          VITE_NATIVE_APP: "1"
          VITE_API_ORIGIN: https://vants.cc
          VITE_AUTH_ORIGIN: https://int.vants.cc
          VITE_ASSET_ORIGIN: https://vants.cc
          VITE_FN_ORIGIN: https://fn.vants.cc
          VITE_INT_ORIGIN: https://int.vants.cc
          VITE_SITE_URL: https://vants.cc
          VITE_GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'semiotic-ion-508913-r1' }}
          VITE_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER || '238603325169' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID || '238603325169-k1kv9sd18gj09skun2570etpdnnkqj5b.apps.googleusercontent.com' }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'semiotic-ion-508913-r1' }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER || '238603325169' }}
        run: |
          rm -rf dist-app
          npx vite build --base=./ --outDir ../dist-app --emptyOutDir
          rm -f dist-app/*.apk dist-app/*.aab dist-app/*.exe dist-app/sw.js dist-app/registerSW.js dist-app/workbox-*.js
          test ! -f dist-app/VANTSMovil.apk
          test ! -f dist-app/sw.js
          ls -la dist-app

      - name: Componentes del SDK de Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(dirname "$(dirname "$(readlink -f "$(command -v sdkmanager || true)")")")/bin/sdkmanager"
          echo "usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" >/dev/null

      - name: Proyecto Capacitor Android
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/cli @capacitor/core @capacitor/android sharp
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configurar Android, Google Play Games v2 (XP + Insignia) y Detección de Juegos
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.codigo }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'semiotic-ion-508913-r1' }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER || '238603325169' }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID || '238603325169-k1kv9sd18gj09skun2570etpdnnkqj5b.apps.googleusercontent.com' }}
          VANTS_PLAY_GAMES_APP_ID: ${{ secrets.VANTS_PLAY_GAMES_APP_ID || secrets.GCP_PROJECT_NUMBER || '238603325169' }}
        run: node script/ci/setup-android.mjs

      - name: Icono, splash y versión
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.codigo }}
        run: node script/ci/app-icono.mjs

      - name: Inyectar firma de release
        env:
          VANTS_KEYSTORE_B64: ${{ secrets.VANTS_ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          printf '%s' "$VANTS_KEYSTORE_B64" | base64 -d > vants-release.jks
          export VANTS_KEYSTORE_FILE="$PWD/vants-release.jks"
          node -e '
            const fs=require("fs");
            const f="android/app/build.gradle";
            let g=fs.readFileSync(f,"utf8");
            const FIRMA = [
              "    signingConfigs {",
              "        release {",
              "            storeFile file(System.getenv(\u0027VANTS_KEYSTORE_FILE\u0027))",
              "            storePassword System.getenv(\u0027VANTS_KEYSTORE_PASSWORD\u0027)",
              "            keyAlias System.getenv(\u0027VANTS_KEY_ALIAS\u0027)",
              "            keyPassword System.getenv(\u0027VANTS_KEY_PASSWORD\u0027)",
              "        }",
              "    }",
            ].join("\n");
            if (!g.includes("signingConfigs {")) {
              g=g.replace(/android\s*\{/, "android {\n"+FIRMA+"\n");
              console.log("signingConfigs inyectado");
            }
            g=g.replace("signingConfig signingConfigs.debug","signingConfig signingConfigs.release");
            if (!g.includes("signingConfig signingConfigs.release")) {
              g=g.replace(/(buildTypes\s*\{[\s\S]*?release\s*\{)/, "$1\n            signingConfig signingConfigs.release");
            }
            fs.writeFileSync(f,g);
            if (!g.includes("signingConfig signingConfigs.release")) {
              console.error("El buildType release no quedo firmado"); process.exit(1);
            }
            console.log("Firma de release lista");
          '

      - name: Construir AAB para Google Play y APK (bundleRelease + assembleRelease)
        env:
          VANTS_KEYSTORE_FILE: ${{ github.workspace }}/vants-release.jks
          VANTS_KEYSTORE_PASSWORD: ${{ secrets.VANTS_KEYSTORE_PASSWORD }}
          VANTS_KEY_PASSWORD: ${{ secrets.VANTS_KEY_PASSWORD }}
          VANTS_KEY_ALIAS: ${{ secrets.VANTS_KEY_ALIAS }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.codigo }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          mv app/build/outputs/bundle/release/app-release.aab ../VANTSMovil-${{ steps.meta.outputs.version }}.aab
          cp ../VANTSMovil-${{ steps.meta.outputs.version }}.aab ../VANTSMovil.aab
          mv app/build/outputs/apk/release/app-release.apk ../VANTSMovil-${{ steps.meta.outputs.version }}.apk
          cp ../VANTSMovil-${{ steps.meta.outputs.version }}.apk ../VANTSMovil.apk
          cd ..
          ls -la VANTSMovil*

      - name: Guardar AAB y APK firmados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANTSMovil-builds
          path: |
            VANTSMovil-${{ steps.meta.outputs.version }}.aab
            VANTSMovil.aab
            VANTSMovil-${{ steps.meta.outputs.version }}.apk
            VANTSMovil.apk

      - name: Publicar en GitHub Releases (Canal exclusivo Móvil · movil-v*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="movil-v${{ steps.meta.outputs.version }}"
          VER="${{ steps.meta.outputs.version }}"
          COD="${{ steps.meta.outputs.codigo }}"
          ARCHIVOS=("VANTSMovil-${VER}.aab" "VANTSMovil.aab" "VANTSMovil-${VER}.apk" "VANTSMovil.apk")
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ARCHIVOS[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ARCHIVOS[@]}" \
              --title "VANTS Movil v${VER} (Android + Tablets · Google Play AAB + APK)" \
              --notes "Canal oficial exclusivo de VANTS Movil v${VER} (versionCode ${COD}, appId cc.vants.app) para Android y Tablets — 100% separado de VANTS Desktop PC (VANTSGAMES/banter). Incluye login 100% in-app, perfil del jugador, lanzador de juegos para torneos y sincronización con Google Play Juegos v2." \
              --latest -R "$GITHUB_REPOSITORY"
          fi
