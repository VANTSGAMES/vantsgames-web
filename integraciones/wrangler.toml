name = "vants-integraciones"
main = "src/index.js"
compatibility_date = "2026-09-22"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vants-db"
database_id = "11e5d82c-307b-44ba-9682-501d8df593d3"

[vars]
AUTH0_DOMAIN = "vants.eu.auth0.com"
AUTH0_AUDIENCE = "https://api.vants.app"
VANTS_AUTH_ISSUER = "https://vants.cc"
GCP_PROJECT_ID = "semiotic-ion-508913-r1"
GCP_PROJECT_NUMBER = "238603325169"
GOOGLE_OAUTH_CLIENT_ID = "238603325169-k1kv9sd18gj09skun2570etpdnnkqj5b.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI = "https://vants.cc/auth/google/callback"
SITE_ORIGINS = "https://vants.cc,https://www.vants.cc"
SITE_URL = "https://vants.cc"
TWITCH_CLIENT_ID = "x6zeqc8b632zlqz21dm88cw5tna8mj"
KICK_CLIENT_ID = "01M4W9NBXSXR43BP4T2KD8KCX1"
EPIC_CLIENT_ID = "xyza7891Z6aDFRRrUpYMO0Hi3cf2Lmni"
# Dominios oficiales (rutas de worker en la zona vants.cc):
#   int.vants.cc  -> este Worker (vants-integraciones)
#   fn.vants.cc   -> vants-functions (linker OAuth)
#   bot.vants.cc  -> vantsbot (Discord)
#   recursos.vants.cc -> vants-recursos
#   bus.vants.cc  -> vants-bus (bus interno de eventos)
# (vants-kick, vants-riot-verify, vants-google-verify y vants-faceit-webhook ya cuelgan de
#  vants.cc mediante rutas: /kick/*, /riot.txt, /google*.html y /api/webhooks/faceit*)
EPIC_REDIRECT_URI = "https://int.vants.cc/epic/callback"
CANALES_TWITCH = "feisreal"
CANALES_KICK = "feispla"
# Tope diario global de llamadas a vidIQ MCP (5 créditos/llamada; 20 = máx 100 créditos/día).
# Sube este número cuando el plan de vidIQ escale con los ingresos de membresías.
VIDIQ_DAILY_GLOBAL_CAP = "20"
VANTS_BUS_PROJECT = "vants-ai"

# Clips subidos desde el ordenador (vÃ­deo en trozos de 20 MB + miniatura).
[[kv_namespaces]]
binding = "CLIPS_KV"
id = "41ab2fde4424430c9702509ed3b4236f"

# Lectura de las insignias que ya concediÃ³ el motor de logros del Worker principal.
[[d1_databases]]
binding = "ACH_DB"
database_name = "vants-logros-db"
database_id = "481584c7-bc47-434b-aa73-3aa066b440f7"

# Service Binding hacia vants-bus (misma cuenta Cloudflare, sin error 1042).
[[services]]
binding = "VANTS_BUS_SERVICE"
service = "vants-bus"

# Service Binding hacia vants-recursos (torneos-realtime) para expulsión RPC desde Sentinel AI.
[[services]]
binding = "TORNEOS_REALTIME"
service = "vants-recursos"
